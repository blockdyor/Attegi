name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (leave empty to use package.json version)'
        required: false
        type: string
      previous_tag:
        description: 'Previous tag to compare (leave empty for auto-detect)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      description: ${{ steps.package.outputs.description }}
      demo: ${{ steps.package.outputs.demo }}
      ghost_version: ${{ steps.package.outputs.ghost_version }}
      size_kb: ${{ steps.package.outputs.size_kb }}
      summary: ${{ steps.summary.outputs.response }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Test template rendering
        run: bun run test:templates

      - name: Validate publication source
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse refs/remotes/origin/main)" ]]

      - name: Get version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          PACKAGE_VERSION=$(bun -e "console.log(require('./package.json').version)")
          if [ -n "$RELEASE_VERSION" ]; then
            VERSION="$RELEASE_VERSION"
          else
            VERSION="$PACKAGE_VERSION"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must have the form x.y.z"
            exit 1
          fi
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Release version must match package.json"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "📌 Version: $VERSION"

      - name: Check if tag exists
        id: check_tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "::error::Tag $RELEASE_TAG already exists; publish a new version instead"
            exit 1
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ Tag $RELEASE_TAG does not exist"
          fi

      - name: Get previous tag
        id: prev_tag
        env:
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          if [ -n "$PREVIOUS_TAG" ]; then
            PREV_TAG="$PREVIOUS_TAG"
          else
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          fi
          if [ -n "$PREV_TAG" ]; then
            git check-ref-format "refs/tags/$PREV_TAG"
            git rev-parse --verify --end-of-options "refs/tags/$PREV_TAG^{commit}" >/dev/null
          fi
          echo "tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "📌 Previous tag: $PREV_TAG"

      - name: Get commit diff
        id: diff
        env:
          PREVIOUS_TAG: ${{ steps.prev_tag.outputs.tag }}
        run: |
          if [ -n "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log -50 "refs/tags/$PREVIOUS_TAG..HEAD" --pretty=format:"- %s" --no-merges)
            FILES_CHANGED=$(git diff --name-only "refs/tags/$PREVIOUS_TAG..HEAD" | head -30)
          else
            COMMITS=$(git log --pretty=format:"- %s" --no-merges -20)
            FILES_CHANGED=$(git diff --name-only HEAD~20..HEAD 2>/dev/null | head -30)
          fi

          # Save to files for fallback
          echo "$COMMITS" > "$RUNNER_TEMP/commits.txt"
          echo "$FILES_CHANGED" > "$RUNNER_TEMP/files.txt"

          # Output commits for Copilot action
          DELIMITER=$(cat /proc/sys/kernel/random/uuid)
          echo "commits<<$DELIMITER" >> "$GITHUB_OUTPUT"
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "$DELIMITER" >> "$GITHUB_OUTPUT"

          # Output for debugging
          echo "📝 Recent commits:"
          echo "$COMMITS"

      - name: Generate release summary
        id: summary
        run: |
          # Read commits
          COMMITS=$(cat "$RUNNER_TEMP/commits.txt")

          # Categorize commits by conventional commit prefixes
          FEATURES=$(echo "$COMMITS" | grep -iE "^- feat" | sed 's/^- feat[^:]*: /- /' | head -5 || true)
          FIXES=$(echo "$COMMITS" | grep -iE "^- fix" | sed 's/^- fix[^:]*: /- /' | head -3 || true)
          IMPROVEMENTS=$(echo "$COMMITS" | grep -iE "^- (improve|update|refactor|enhance|style|perf)" | sed 's/^- [^:]*: /- /' | head -3 || true)
          DOCS=$(echo "$COMMITS" | grep -iE "^- doc" | sed 's/^- doc[^:]*: /- /' | head -2 || true)

          # Build summary
          SUMMARY=""
          if [ -n "$FEATURES" ]; then
            SUMMARY="${SUMMARY}#### ✨ New Features
          ${FEATURES}

          "
          fi
          if [ -n "$FIXES" ]; then
            SUMMARY="${SUMMARY}#### 🐛 Bug Fixes
          ${FIXES}

          "
          fi
          if [ -n "$IMPROVEMENTS" ]; then
            SUMMARY="${SUMMARY}#### 🎨 Improvements
          ${IMPROVEMENTS}

          "
          fi
          if [ -n "$DOCS" ]; then
            SUMMARY="${SUMMARY}#### 📝 Documentation
          ${DOCS}

          "
          fi

          # Default if empty
          if [ -z "$SUMMARY" ]; then
            SUMMARY="Minor updates and improvements. See commits below for details."
          fi

          # Output
          DELIMITER=$(cat /proc/sys/kernel/random/uuid)
          echo "response<<$DELIMITER" >> "$GITHUB_OUTPUT"
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "$DELIMITER" >> "$GITHUB_OUTPUT"

      - name: Build and package
        run: |
          bun run clean
          bun run build
          bun run compress

      - name: Validate theme
        run: bun scripts/validate-theme.js

      - name: Extract package info
        id: package
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          pkg = json.loads(Path('package.json').read_text())
          values = dict(version=pkg['version'], name=pkg['name'], description=pkg['description'],
                        demo=pkg['demo'], ghost_version=pkg['engines']['ghost'], license=pkg['license'])
          if any(not isinstance(value, str) or '\r' in value or '\n' in value for value in values.values()):
              raise ValueError('Invalid package metadata')
          if values['name'] != 'attegi' or not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', values['version']):
              raise ValueError('Invalid package identity/version')
          values['size_kb'] = str(Path('dist/attegi.zip').stat().st_size // 1024) + 'KB'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(''.join(f'{key}={value}\n' for key, value in values.items()))
          PY

      - name: Upload release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: attegi-release
          path: dist/attegi.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    if: needs.build.result == 'success' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PACKAGE_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Recheck publication source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_TAG" == "v$PACKAGE_VERSION" ]]
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          MAIN_REF=refs/heads/main
          MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/${MAIN_REF#refs/}" --jq .object.sha)
          [[ "$SOURCE_SHA" == "$MAIN_SHA" ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]

      - name: Download release archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: attegi-release
          path: dist

      - name: Create and push tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_SHA=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$RELEASE_TAG" -f message="Release $RELEASE_TAG" -f object="$SOURCE_SHA" -f type=commit --jq .sha)
          [[ "$TAG_SHA" =~ ^[a-f0-9]{40}$ ]]
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$TAG_SHA"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Attegi for blockdyor ${{ needs.build.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: dist/attegi.zip
          body: |
            ## 🎨 Attegi for blockdyor ${{ needs.build.outputs.tag }}

            ${{ needs.build.outputs.description }}

            ### 📝 What's Changed

            ${{ needs.build.outputs.summary }}

            ### 📥 Installation

            1. **Download** `attegi.zip` from the assets below
            2. **Navigate** to Ghost Admin → Settings → Design
            3. **Upload** the theme zip file
            4. **Activate** the Attegi theme

            ### 🔗 Links

            - **Live Demo**: ${{ needs.build.outputs.demo }}
            - **Documentation**: [README.md](https://github.com/${{ github.repository }}/blob/main/README.md)
            - **中文文档**: [README_zh.md](https://github.com/${{ github.repository }}/blob/main/README_zh.md)

            ### 📊 Package Info

            | Item | Value |
            |------|-------|
            | Size | ${{ needs.build.outputs.size_kb }} |
            | Ghost Version | ${{ needs.build.outputs.ghost_version }} |
            | Validation | ✅ Passed GScan |
            | License | GNU AGPL v3.0 |

            ---
            *Release notes generated with GitHub Copilot*
