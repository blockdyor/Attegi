name: Build Theme

on:
  push:
    branches: [ master, main ]
    tags: [ '*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Test template rendering
        run: bun run test:templates

      - name: Clean dist
        run: rm -rf dist/ || true

      - name: Build assets
        run: bun run build

      - name: Package theme
        run: bun run compress

      - name: Validate theme with GScan
        run: bunx gscan@6.7.0 -z dist/attegi.zip

      - name: Extract package info
        id: package
        run: |
          VERSION=$(bun -e "console.log(require('./package.json').version)")
          NAME=$(bun -e "console.log(require('./package.json').name)")
          DESCRIPTION=$(bun -e "console.log(require('./package.json').description)")
          DEMO=$(bun -e "console.log(require('./package.json').demo)")
          GHOST_VERSION=$(bun -e "console.log(require('./package.json').engines.ghost)")
          LICENSE=$(bun -e "console.log(require('./package.json').license)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "description=$DESCRIPTION" >> $GITHUB_OUTPUT
          echo "demo=$DEMO" >> $GITHUB_OUTPUT
          echo "ghost_version=$GHOST_VERSION" >> $GITHUB_OUTPUT
          echo "license=$LICENSE" >> $GITHUB_OUTPUT

      - name: Check package size
        id: size
        run: |
          SIZE=$(du -h dist/attegi.zip | cut -f1)
          SIZE_BYTES=$(stat -f%z dist/attegi.zip 2>/dev/null || stat -c%s dist/attegi.zip)
          SIZE_KB=$((SIZE_BYTES / 1024))
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "size_kb=${SIZE_KB}KB" >> $GITHUB_OUTPUT
          echo "📦 Package size: $SIZE (${SIZE_KB}KB)"
          ls -lh dist/attegi.zip

      - name: Prepare artifact contents
        run: |
          rm -rf dist/artifact
          mkdir -p dist/artifact
          python - <<'PY'
          import zipfile

          with zipfile.ZipFile('dist/attegi.zip') as zf:
              zf.extractall('dist/artifact')
          PY

      - name: Upload theme artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.package.outputs.name }}-v${{ steps.package.outputs.version }}
          path: dist/artifact
          retention-days: 90

      - name: Create release and attach zip
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: ${{ steps.package.outputs.name }} v${{ steps.package.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/attegi.zip
          body: |
            ## 🎨 ${{ steps.package.outputs.name }} v${{ steps.package.outputs.version }}

            ${{ steps.package.outputs.description }}

            ### 📥 Installation

            1. **Download** `attegi.zip` from the assets below
            2. **Navigate** to Ghost Admin → Settings → Design
            3. **Upload** the theme zip file
            4. **Activate** the Attegi theme

            ### 🔗 Links

            - **Live Demo**: ${{ steps.package.outputs.demo }}
            - **Documentation**: [README.md](https://github.com/${{ github.repository }}/blob/main/README.md)
            - **中文文档**: [README_zh.md](https://github.com/${{ github.repository }}/blob/main/README_zh.md)

            ### ✨ Features

            - 🎨 Dual theme support (Light/Dark/System)
            - 📱 Mobile optimized & responsive
            - 💻 Enhanced code blocks with syntax highlighting
            - 🧭 Smart post navigation
            - 🌍 32 language translations
            - ♿ WCAG accessible
            - 🚀 Optimized performance

            ### 📊 Package Info

            - **Size**: ${{ steps.size.outputs.size_kb }}
            - **Ghost Version**: ${{ steps.package.outputs.ghost_version }}
            - **Validation**: ✅ Passed GScan
            - **License**: ${{ steps.package.outputs.license }}

            ### 📝 What's Changed

            See the full changelog below.
