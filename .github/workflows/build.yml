name: Build Theme

on:
  push:
    branches: [ master, main ]
    tags: [ '*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
      description: ${{ steps.package.outputs.description }}
      demo: ${{ steps.package.outputs.demo }}
      ghost_version: ${{ steps.package.outputs.ghost_version }}
      license: ${{ steps.package.outputs.license }}
      size_kb: ${{ steps.size.outputs.size_kb }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Setup Node for native regexp verification
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.7.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Test template rendering
        run: bun run test:templates

      - name: Clean dist
        run: rm -rf dist/ || true

      - name: Build assets
        run: bun run build

      - name: Package theme
        run: bun run compress

      - name: Validate theme with GScan
        run: bun scripts/validate-theme.js

      - name: Extract package info
        id: package
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          pkg = json.loads(Path('package.json').read_text())
          values = dict(version=pkg['version'], name=pkg['name'], description=pkg['description'],
                        demo=pkg['demo'], ghost_version=pkg['engines']['ghost'], license=pkg['license'])
          if any(not isinstance(value, str) or '\r' in value or '\n' in value for value in values.values()):
              raise ValueError('Invalid package metadata')
          if values['name'] != 'attegi' or not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', values['version']):
              raise ValueError('Invalid package identity/version')
          values['size_kb'] = str(Path('dist/attegi.zip').stat().st_size // 1024) + 'KB'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(''.join(f'{key}={value}\n' for key, value in values.items()))
          PY

      - name: Validate publication source
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then exit 0; fi
          [[ "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$GITHUB_REF" == "refs/tags/v$PACKAGE_VERSION" ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse refs/remotes/origin/main)" ]]
          [[ "$GITHUB_SHA" == "$(git rev-parse --verify --end-of-options "$GITHUB_REF^{commit}")" ]]

      - name: Check package size
        id: size
        run: |
          SIZE=$(du -h dist/attegi.zip | cut -f1)
          SIZE_BYTES=$(stat -f%z dist/attegi.zip 2>/dev/null || stat -c%s dist/attegi.zip)
          SIZE_KB=$((SIZE_BYTES / 1024))
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "size_kb=${SIZE_KB}KB" >> $GITHUB_OUTPUT
          echo "📦 Package size: $SIZE (${SIZE_KB}KB)"
          ls -lh dist/attegi.zip

      - name: Prepare artifact contents
        run: |
          rm -rf dist/artifact
          mkdir -p dist/artifact
          python - <<'PY'
          import zipfile

          with zipfile.ZipFile('dist/attegi.zip') as zf:
              zf.extractall('dist/artifact')
          PY

      - name: Upload theme artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.package.outputs.name }}-v${{ steps.package.outputs.version }}
          path: dist/artifact
          retention-days: 90

      - name: Upload release archive
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: attegi-release
          path: dist/attegi.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    if: needs.build.result == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PACKAGE_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_TAG: ${{ github.ref_name }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Recheck publication source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_TAG" == "v$PACKAGE_VERSION" ]]
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          MAIN_REF=refs/heads/main
          MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/${MAIN_REF#refs/}" --jq .object.sha)
          [[ "$SOURCE_SHA" == "$MAIN_SHA" ]]
          [[ "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" ]]
          TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          [[ "$SOURCE_SHA" == "$TAG_SHA" ]]

      - name: Download release archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: attegi-release
          path: dist

      - name: Create release and attach zip
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Attegi for blockdyor v${{ needs.build.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/attegi.zip
          body: |
            ## 🎨 Attegi for blockdyor v${{ needs.build.outputs.version }}

            ${{ needs.build.outputs.description }}

            ### 📥 Installation

            1. **Download** `attegi.zip` from the assets below
            2. **Navigate** to Ghost Admin → Settings → Design
            3. **Upload** the theme zip file
            4. **Activate** the Attegi theme

            ### 🔗 Links

            - **Live Demo**: ${{ needs.build.outputs.demo }}
            - **Documentation**: [README.md](https://github.com/${{ github.repository }}/blob/main/README.md)
            - **中文文档**: [README_zh.md](https://github.com/${{ github.repository }}/blob/main/README_zh.md)

            ### ✨ Features

            - 🎨 Dual theme support (Light/Dark/System)
            - 📱 Mobile optimized & responsive
            - 💻 Enhanced code blocks with syntax highlighting
            - 🧭 Smart post navigation
            - 🌍 32 language translations
            - ♿ WCAG accessible
            - 🚀 Optimized performance

            ### 📊 Package Info

            - **Size**: ${{ needs.build.outputs.size_kb }}
            - **Ghost Version**: ${{ needs.build.outputs.ghost_version }}
            - **Validation**: ✅ Passed GScan
            - **License**: ${{ needs.build.outputs.license }}

            ### 📝 What's Changed

            See the full changelog below.
