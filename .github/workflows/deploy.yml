name: Deploy to Ghost

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
          - both

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build theme
        run: |
          bun run clean
          bun run build
          bun run compress

      - name: Validate theme
        run: bunx gscan@6.7.0 -z dist/attegi.zip

      - name: Upload theme artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: attegi-theme-zip
          path: dist/attegi.zip
          if-no-files-found: error
          retention-days: 1

  deploy-dev:
    if: ${{ inputs.target == 'dev' || inputs.target == 'both' }}
    needs: build
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Download theme artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: attegi-theme-zip
          path: dist

      - name: Deploy to Ghost (dev)
        env:
          GHOST_ADMIN_API_URL: ${{ secrets.GHOST_ADMIN_API_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
          GHOST_ADMIN_API_VERSION: v6.0
        run: bun scripts/deploy-theme.js dist/attegi.zip

  deploy-prod:
    if: ${{ inputs.target == 'prod' || inputs.target == 'both' }}
    needs: build
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Download theme artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: attegi-theme-zip
          path: dist

      - name: Deploy to Ghost (prod)
        env:
          GHOST_ADMIN_API_URL: ${{ secrets.GHOST_ADMIN_API_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
          GHOST_ADMIN_API_VERSION: v6.0
        run: bun scripts/deploy-theme.js dist/attegi.zip
